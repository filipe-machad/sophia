services:
  postgres:
    image: postgres:17-alpine
    container_name: entrelaco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: entrelaco
      POSTGRES_USER: entrelaco
      POSTGRES_PASSWORD: entrelaco_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - entrelaco_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrelaco -d entrelaco"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  entrelaco_postgres_data:
